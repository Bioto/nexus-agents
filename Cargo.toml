[package]
name = "nexus-agents"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dotenvy = "0.15"
ratatui = "0.28"
crossterm = "0.28"
textwrap = "0.16"
futures = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
mockito = "1.3"
