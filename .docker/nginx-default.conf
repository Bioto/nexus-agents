# Use resolver for dynamic DNS resolution (Docker's internal DNS)
resolver 127.0.0.11 valid=30s;

# HTTP server
server {
    listen 80;
    server_name _;

    # Redirect to HTTPS if SSL certificates exist
    # This is handled by the startup script that conditionally includes nginx-https.conf
    if (-f /etc/nginx/ssl/cert.pem) {
        return 301 https://$host$request_uri;
    }

    location /test {
        # Use variables for dynamic DNS resolution
        set $test_backend "http://test-server:8080";
        proxy_pass $test_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        # Use variables for dynamic DNS resolution
        # Personal instance (Nick)
        set $mcp_backend "http://nutrition-mcp-server:8002";
        proxy_pass $mcp_backend/mcp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long-running connections (SSE)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /mcp-public {
        # Use variables for dynamic DNS resolution
        # Public instance (Friend)
        set $mcp_public_backend "http://nutrition-mcp-server-public:8002";
        proxy_pass $mcp_public_backend/mcp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for long-running connections (SSE)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}

# HTTPS server block is conditionally included by docker-entrypoint.sh
# if SSL certificates are present

