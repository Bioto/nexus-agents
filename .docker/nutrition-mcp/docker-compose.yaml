# Docker Compose for Nutrition MCP Server
#
# This builds ONLY the x_toolbox crate containing the nutrition MCP server.
# No other workspace crates (nexus_*, etc.) are included in this build.
#
# Modules included:
#   - x_toolbox/src/nutrition/       (mcp_server, database, service, models, config)
#   - x_toolbox/src/error.rs
#   - x_toolbox/src/bin/nutrition_mcp_server.rs
#   - x_toolbox/migrations/          (PostgreSQL schema)
#
# Two instances (both via nginx with SSL):
#   - Personal (Nick): /mcp -> mcp-server:8002, postgres on 5433
#   - Public (Friend): /mcp-public -> mcp-server-public:8002, postgres on 5434

services:
  # =============================================================================
  # PERSONAL INSTANCE (Nick) - via nginx on ports 80/443
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: nutrition_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nutrition
    ports:
      - "5433:5432"
    volumes:
      - nutrition_postgres_data:/var/lib/postgresql/data
      # Mount migrations for easy access
      - ../../src/x_toolbox/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-server:
    build:
      context: ./test-server
    image: test-server:latest
    container_name: nutrition_test_server
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: nutrition-nginx:latest
    container_name: nutrition_nginx
    ports:
      - "80:80"
      - "443:443"
    # SSL certificates are built into the image (see nginx/Dockerfile)
    # To update certs: place new cert.pem and key.pem in ssl/ and rebuild
    depends_on:
      - nutrition-mcp-server
      - test-server
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE

  nutrition-mcp-server:
    image: bioto/mcp:latest
    container_name: nutrition_mcp_server
    expose:
      - "8002"
    ports:
      # Direct access for local development (bypass nginx)
      - "8002:8002"
    environment:
      # Database config - always uses the local postgres service in this compose
      # For personal instance, always connect to local postgres container
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: nutrition
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nutrition
      # Pass through from host environment (for extract_recipe_from_url tool)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Optional: Bearer token for HTTP auth
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # =============================================================================
  # PUBLIC INSTANCE (Friend) - via nginx on /mcp-public
  # Only started with --profile public flag
  # =============================================================================
  postgres-public:
    profiles:
      - public
    image: postgres:16-alpine
    container_name: nutrition_postgres_public
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nutrition
    ports:
      - "5434:5432"
    volumes:
      - nutrition_postgres_public_data:/var/lib/postgresql/data
      - ../../src/x_toolbox/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nutrition-mcp-server-public:
    profiles:
      - public
    image: bioto/mcp:latest
    container_name: nutrition_mcp_server_public
    expose:
      - "8002"
    environment:
      POSTGRES_HOST: postgres-public
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: nutrition
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@postgres-public:5432/nutrition
      # Pass through from host environment (for extract_recipe_from_url tool)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Optional: Bearer token for HTTP auth (can use different token for public)
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN_PUBLIC}
    depends_on:
      postgres-public:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nutrition_postgres_data:
  nutrition_postgres_public_data:

# Usage:
#
# Start the stack (personal instance only, for local dev):
#   docker compose -f .docker/nutrition-mcp/docker-compose.yaml up -d
#
# Start with public instance (production):
#   docker compose -f .docker/nutrition-mcp/docker-compose.yaml --profile public up -d
#
# Apply migrations - Personal instance (after first start):
#   docker exec -i nutrition_postgres psql -U postgres -d nutrition < src/x_toolbox/migrations/001_initial_schema.sql
#   docker exec -i nutrition_postgres psql -U postgres -d nutrition < src/x_toolbox/migrations/002_meal_plans.sql
#   docker exec -i nutrition_postgres psql -U postgres -d nutrition < src/x_toolbox/migrations/003_family_members_and_favorites.sql
#
# Apply migrations - Public instance (after first start, if using --profile public):
#   docker exec -i nutrition_postgres_public psql -U postgres -d nutrition < src/x_toolbox/migrations/001_initial_schema.sql
#   docker exec -i nutrition_postgres_public psql -U postgres -d nutrition < src/x_toolbox/migrations/002_meal_plans.sql
#   docker exec -i nutrition_postgres_public psql -U postgres -d nutrition < src/x_toolbox/migrations/003_family_members_and_favorites.sql
#
# View logs:
#   docker compose -f .docker/nutrition-mcp/docker-compose.yaml logs -f
#
# Stop:
#   docker compose -f .docker/nutrition-mcp/docker-compose.yaml down
#
# Stop and remove volumes:
#   docker compose -f .docker/nutrition-mcp/docker-compose.yaml down -v
#
# Access:
#   Direct (local dev, bypasses nginx): http://localhost:8002/mcp
#   Via nginx with SSL (production):
#     Personal (Nick): https://your-domain/mcp
#     Public (Friend): https://your-domain/mcp-public (only if started with --profile public)
#
# SSL Setup (for Cloudflare):
#   1. Add your Cloudflare Origin Certificate to ssl/cert.pem
#   2. Add your private key to ssl/key.pem
#   3. Rebuild nginx: docker compose -f .docker/nutrition-mcp/docker-compose.yaml build nginx
#   4. Restart: docker compose -f .docker/nutrition-mcp/docker-compose.yaml up -d nginx
#   5. Set Cloudflare SSL mode to "Full" or "Full (strict)"
#   See ssl/README.md for detailed instructions

