[package]
name = "nexus-audio"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nexus-audio"
path = "src/main.rs"

[dependencies]
ratatui = { workspace = true }
crossterm = "0.28"
portaudio = "0.7"
cpal = "0.15"  # Still needed for tts.rs and some methods - will be removed later
tokio = { workspace = true, features = ["full"] }
anyhow = "1.0"
clap = { workspace = true }
thiserror = "2.0"
chrono = "0.4.38"
hound = "3.5"
ctrlc = "3.4"
log = "0.4.22"
simplelog = "0.12.2"
whisper-rs = "0.15"
reqwest = { workspace = true }
rodio = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
rmp-serde = "1.1"
url = "2.5"
futures-util = "0.3"
http = "1.1"
# VAD temporarily disabled - incompatible with current ONNX runtime
# moshi-server removed - it's not used as a Rust dependency and requires CUDA
# If needed, install it separately: cargo install --features cuda moshi-server@0.6.4
# silero-vad-rs = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
