[package]
name = "nexus-notetaker"
version = "0.1.0"
edition = "2021"
description = "AI-powered note taking over unified recording sessions"

[[bin]]
name = "nexus-notetaker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { workspace = true }
log = "0.4"
nexus-core = { path = "../nexus_core" }
nexus-storage = { path = "../nexus_storage", default-features = false, features = ["clickhouse"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
tokio = { workspace = true, features = ["full"] }

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
expect_used = "warn"
