[package]
name = "nexus-screen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nexus-screen"
path = "src/main.rs"


[dependencies]
ratatui = { workspace = true }
crossterm = "0.28"
tokio = { workspace = true, features = ["full"] }
anyhow = "1.0"
clap = { workspace = true }
thiserror = "2.0"
chrono = "0.4.38"
ctrlc = "3.4"
log = "0.4.22"
simplelog = "0.12.2"
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ffmpeg-next = { git = "https://github.com/zmwangx/rust-ffmpeg" }
image = "0.25"
tracing = "0.1"  # Added for debug/info logging in recording loop
glob = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
# For testing FFmpeg mocks, consider mockall if needed

[[bench]]
name = "screen_recording"
harness = false

# Note: To enforce Clippy in CI, add to .github/workflows/ci.yml:
# - name: Run Clippy
#   run: cargo clippy --all-targets --all-features -- -D warnings

