[package]
name = "nexus-screen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nexus-screen"
path = "src/main.rs"

[[example]]
name = "test_x11grab"
path = "test_x11grab.rs"

[dependencies]
ratatui = { workspace = true }
crossterm = "0.28"
tokio = { workspace = true, features = ["full"] }
anyhow = "1.0"
clap = { workspace = true }
thiserror = "2.0"
chrono = "0.4"
ctrlc = "3.4"
log = "0.4"
simplelog = "0.12"
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ffmpeg-next = "8.0.0"
image = "0.25"

