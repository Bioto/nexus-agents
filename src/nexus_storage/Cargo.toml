[package]
name = "nexus-storage"
version = "0.1.0"
edition = "2021"

[lib]
name = "nexus_storage"
path = "src/lib.rs"

[features]
default = []
clickhouse = ["reqwest", "clickhouse-rs"]
postgres = ["sqlx"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.0"
reqwest = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "bigdecimal"], optional = true }
thiserror = "2.0"
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true }
clickhouse-rs = { version = "1.1.0-alpha.1", features = ["tls"], optional = true }
