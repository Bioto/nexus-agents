[package]
name = "nexus-exporter"
version = "0.1.0"
edition = "2021"
description = "Export module for generating PDFs and other document formats"

[[bin]]
name = "nexus-exporter"
path = "src/main.rs"

[dependencies]
# CLI & Async
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"

# Logging
log = "0.4.22"
simplelog = "0.12.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PDF generation
printpdf = "0.7"

# Time
chrono = { version = "0.4.38", features = ["serde"] }

[lints.clippy]
# Enable pedantic lints (very strict, but helpful)
pedantic = "warn"
# Warn about unwrap() usage (prefer proper error handling)
unwrap_used = "warn"
# Warn about expect() usage (prefer proper error handling)
expect_used = "warn"
# Warn about missing documentation on public items
missing_docs = "warn"
# Warn about unused results (encourages #[must_use])
unused_must_use = "warn"

