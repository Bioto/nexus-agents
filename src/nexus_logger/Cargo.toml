[package]
name = "nexus_logger"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "nexus-logger"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
device_query = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.38"
ctrlc = "3.4"
