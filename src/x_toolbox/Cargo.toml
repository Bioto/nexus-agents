[package]
name = "x_toolbox"
version = "0.1.0"
edition = "2021"

# SQLx offline mode - uses query cache instead of live database connection
# Generate cache with: cargo sqlx prepare --database-url "postgresql://postgres:postgres@localhost:5432/nutrition"

[[bin]]
name = "x-toolbox"
path = "src/main.rs"

[[bin]]
name = "nutrition-mcp-server"
path = "src/bin/nutrition_mcp_server.rs"

[[bin]]
name = "fitness-mcp-server"
path = "src/bin/fitness_mcp_server.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true, features = ["full"] }
anyhow = "1.0"
thiserror = "2.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "bigdecimal"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1.33"
bigdecimal = { version = "0.3", features = ["serde"] }
axum = { version = "0.7", features = ["json", "query"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { workspace = true }
rmcp = { version = "0.8.5", features = ["macros", "server", "transport-io", "transport-streamable-http-server"] }
tokio-util = "0.7"
reqwest = { workspace = true }
scraper = "0.20"
dotenvy = "0.15"
csv = "1.3"
regex = "1.10"
futures = "0.3"
